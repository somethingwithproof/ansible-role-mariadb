---
# Tasks for installing MariaDB

- name: Refresh Debian package metadata before installing prerequisites
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Ensure prerequisite packages are installed
  ansible.builtin.package:
    name: "{{ mariadb_prerequisite_packages }}"
    state: present
  register: package_result
  until: package_result is success
  retries: 3
  delay: 5

- name: Configure MariaDB repository
  when: mariadb_configure_repo | bool
  block:
    - name: Add MariaDB APT key (Debian family)
      when: ansible_os_family == 'Debian'
      ansible.builtin.apt_key:
        keyserver: "{{ mariadb_repo_keyserver }}"
        id: "{{ mariadb_repo_key }}"

    - name: Add MariaDB APT repository (Debian family)
      when: ansible_os_family == 'Debian'
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://mirror.23media.com/mariadb/repo/{{
          mariadb_repo_version }}/{{ ansible_distribution | lower }} {{
            ansible_distribution_release }} main"
        filename: mariadb
        state: present

    - name: Add MariaDB YUM repository (RedHat family)
      when: ansible_os_family == 'RedHat'
      ansible.builtin.yum_repository:
        name: mariadb
        description: "MariaDB {{ mariadb_repo_version }} repository"
        baseurl: "https://yum.mariadb.org/{{ mariadb_repo_version }}/{{
          ansible_distribution | lower }}{{ ansible_distribution_major_version
            }}-amd64"
        gpgkey: "https://yum.mariadb.org/RPM-GPG-KEY-MariaDB"
        gpgcheck: true
        state: present

- name: Install MariaDB packages
  ansible.builtin.package:
    name: "{{ mariadb_packages + mariadb_additional_packages }}"
    state: present
    update_cache: true
  register: mariadb_package_install
  until: mariadb_package_install is success
  retries: 3
  delay: 5

- name: Install the scheduler for enabled operational tasks
  ansible.builtin.package:
    name: "{{ 'cron' if ansible_facts.os_family == 'Debian' else 'cronie' }}"
    state: present
  when: mariadb_backup_enabled | bool or mariadb_monitoring_enabled | bool

- name: Start the scheduler for enabled operational tasks
  ansible.builtin.service:
    name: "{{ 'cron' if ansible_facts.os_family == 'Debian' else 'crond' }}"
    state: started
    enabled: true
  when: mariadb_backup_enabled | bool or mariadb_monitoring_enabled | bool

- name: Ensure the MariaDB systemd override directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ mariadb_service_name }}.service.d"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure the MariaDB automatic restart policy
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ mariadb_service_name }}.service.d/10-ansible-restart.conf"
    content: |
      [Service]
      Restart={{ 'on-failure' if mariadb_auto_restart | bool else 'no' }}
    owner: root
    group: root
    mode: '0644'
  register: mariadb_restart_policy

- name: Ensure MariaDB service is started and enabled
  ansible.builtin.systemd_service:
    daemon_reload: "{{ mariadb_restart_policy.changed }}"
    name: "{{ mariadb_service_name }}"
    state: "{{ mariadb_service_state }}"
    enabled: "{{ mariadb_service_enabled }}"

- name: Discover the running database without changing its storage
  block:
    - name: Read the data directory using existing local administrator access
      community.mysql.mysql_query:
        login_user: root
        login_unix_socket: "{{ mariadb_socket }}"
        query: >-
          SELECT @@datadir AS data_dir,
          SUBSTRING_INDEX(VERSION(), '-', 1) AS server_version
      register: mariadb_data_directory_query
      changed_when: false
      no_log: true
  rescue:
    - name: Read the data directory using the supplied root credentials
      community.mysql.mysql_query:
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: "{{ mariadb_socket }}"
        config_file: ''
        query: >-
          SELECT @@datadir AS data_dir,
          SUBSTRING_INDEX(VERSION(), '-', 1) AS server_version
      register: mariadb_data_directory_query
      changed_when: false
      no_log: true

- name: Retain the existing data directory when inventory does not override it
  ansible.builtin.set_fact:
    mariadb_current_data_dir: "{{ mariadb_data_directory_query.query_result[0][0].data_dir | regex_replace('/$', '') }}"
    mariadb_running_version: "{{ mariadb_data_directory_query.query_result[0][0].server_version }}"

- name: Require an explicit migration before changing database data directories
  ansible.builtin.assert:
    that:
      - mariadb_data_dir | regex_replace('/$', '') == mariadb_current_data_dir
    fail_msg: >-
      The running database uses {{ mariadb_current_data_dir }} but inventory
      requests {{ mariadb_data_dir }}. Migrate the database explicitly before
      changing its data directory; this role does not move existing data.

- name: Ensure MariaDB directories exist with correct permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: mysql
    group: mysql
    mode: '0750'
  loop: "{{ mariadb_directories | select() | list }}"
  vars:
    mariadb_directories:
      - "{{ mariadb_data_dir }}"
      - "{{ mariadb_log_dir }}"
