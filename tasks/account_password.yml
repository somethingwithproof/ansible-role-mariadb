---
# Keep plaintext available to MariaDB's strict server-side password validator.
# mysql_user's prehashed CREATE/ALTER path cannot be validated by that plugin.
- name: Inspect the managed account password
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ omit if mariadb_root_client_config.stat.exists else mariadb_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"
    query: >-
      SELECT COUNT(*) AS present,
      COALESCE(SUM(authentication_string = PASSWORD(%(password)s)
        AND plugin = 'mysql_native_password'), 0) AS matches_password
      FROM mysql.user WHERE User = %(name)s AND Host = %(host)s
    named_args:
      name: "{{ mariadb_account_name }}"
      host: "{{ mariadb_account_host }}"
      password: "{{ mariadb_account_password }}"
  register: mariadb_account_status
  changed_when: false
  no_log: true

- name: Create an account with a server-validated password
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ omit if mariadb_root_client_config.stat.exists else mariadb_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"
    query: "CREATE USER %(name)s@%(host)s IDENTIFIED BY %(password)s"
    named_args:
      name: "{{ mariadb_account_name }}"
      host: "{{ mariadb_account_host }}"
      password: "{{ mariadb_account_password }}"
  when: mariadb_account_status.query_result[0][0].present | int == 0
  no_log: true

- name: Rotate an existing account password through server validation
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ omit if mariadb_root_client_config.stat.exists else mariadb_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"
    query: "ALTER USER %(name)s@%(host)s IDENTIFIED BY %(password)s"
    named_args:
      name: "{{ mariadb_account_name }}"
      host: "{{ mariadb_account_host }}"
      password: "{{ mariadb_account_password }}"
  when:
    - mariadb_account_status.query_result[0][0].present | int > 0
    - mariadb_account_status.query_result[0][0].matches_password | int == 0
  no_log: true
