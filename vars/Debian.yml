---
# MariaDB variables specific to Debian-based systems

mariadb_platform_service_name: mariadb
mariadb_platform_packages:
  - mariadb-server
  - mariadb-client
  - python3-pymysql
  - python3-mysqldb

mariadb_platform_prerequisite_packages:
  - apt-transport-https
  - ca-certificates
  - gnupg
  - curl
