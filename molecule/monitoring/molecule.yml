---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-/sbin/init}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    exposed_ports:
      - "9104"
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_enabled: profile_tasks, timer, yaml
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
  inventory:
    host_vars:
      instance:
        ansible_become: false
        mariadb_allow_remote_connections: true
        mariadb_configure_repo: false
        mariadb_root_password: "MoleculeTest123!"
        mariadb_bind_address: "0.0.0.0"
        mariadb_version: "${MOLECULE_MARIADB_VERSION:-10.6}"
        mariadb_databases:
          - name: monitoring_test_db
            encoding: utf8mb4
            collation: utf8mb4_unicode_ci
        mariadb_users:
          - name: monitoring_test_user
            password: MonitoringTest123!
            priv: "monitoring_test_db.*:ALL"
        mariadb_monitoring_enabled: true
        mariadb_monitoring_user: "mysql_exporter"
        mariadb_monitoring_password: "ExporterPass123!"
        mariadb_exporter_enabled: true
        mariadb_exporter_port: 9104
verifier:
  name: ansible
lint: |
  set -e
  yamllint .
  ansible-lint --profile min
