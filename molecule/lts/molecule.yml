---
driver:
  name: docker
platforms:
  - name: mariadb-lts-ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
  - name: mariadb-lts-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
  - name: mariadb-lts-ubuntu2604
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
  - name: mariadb-lts-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
  - name: mariadb-lts-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
  - name: mariadb-lts-rockylinux9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
  - name: mariadb-lts-rockylinux10
    image: geerlingguy/docker-rockylinux10-ansible:latest
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_become: false
        ansible_python_interpreter: /usr/bin/python3
        mariadb_tagged_test_password: "TaggedUser'123!%"
        mariadb_tagged_root_password: MoleculeRotated123!
        mariadb_root_password: MoleculeRoot123!
        mariadb_allow_remote_connections: true
        mariadb_bind_address: "0.0.0.0"
        mariadb_innodb_buffer_pool_size: 128M
        mariadb_max_connections: 20
        mariadb_databases:
          - name: molecule_lts
        mariadb_users:
          - name: molecule_lts
            password: MoleculeUser123!
            priv: 'molecule_lts.*:ALL'
verifier:
  name: ansible
