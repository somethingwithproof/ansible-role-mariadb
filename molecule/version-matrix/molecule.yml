---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: mariadb-1011
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - mariadb_1011
  - name: mariadb-118
    image: geerlingguy/docker-debian13-ansible:latest
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - mariadb_118
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_enabled: profile_tasks, timer, yaml
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
  inventory:
    group_vars:
      all:
        ansible_become: false
        mariadb_configure_repo: false
        mariadb_root_password: MoleculeTest123!
        mariadb_bind_address: 0.0.0.0
        mariadb_allow_remote_connections: true
        mariadb_databases:
          - name: version_test_db
        mariadb_users:
          - name: version_test_user
            password: VersionTest123!
            priv: version_test_db.*:ALL
      mariadb_1011:
        mariadb_version: '10.11'
      mariadb_118:
        mariadb_version: '11.8'
verifier:
  name: ansible
lint: 'set -e

  yamllint .

  ansible-lint --profile min

  '
